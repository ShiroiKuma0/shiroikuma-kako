<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; object-src 'none'; script-src resource: chrome:; connect-src https:; img-src https: data: blob: chrome:; style-src 'unsafe-inline';"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-l10n-id="newtab-page-title"></title>
    <link
      rel="icon"
      type="image/png"
      href="chrome://branding/content/icon32.png"
    />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="toolkit/branding/brandings.ftl" />
    <link rel="localization" href="browser/newtab/newtab.ftl" />
    <!-- Fork: 白い熊 火狐 New Tab overrides.
         about:newtab picks its document at runtime in
         AboutNewTabRedirector.sys.mjs#defaultURL: this host document when
         browser.newtabpage.activity-stream.remote-renderer.enabled is true, and
         prerendered/activity-stream.html otherwise. That pref can be flipped
         remotely, so BOTH documents must carry the link or the theming appears
         to come and go on its own. The renderer injects its own stylesheet at
         runtime, after this one -- hence the !important throughout the file. -->
    <link
      rel="stylesheet"
      href="chrome://newtab/content/css/kako-newtab.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="resource://newtab/data/content/newtab-render.js"></script>
  </body>
</html>
