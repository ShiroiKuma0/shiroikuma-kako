buildscript {
    // in mozilla-central there's no build.gradle suitable for the maven/glean config, so each component gets it.
    if (gradle.hasProperty("mozconfig")) {
        repositories {
            gradle.mozconfig.substs.GRADLE_MAVEN_REPOSITORIES.each { repository ->
                maven {
                    url = repository
                    if (gradle.mozconfig.substs.ALLOW_INSECURE_GRADLE_REPOSITORIES) {
                        allowInsecureProtocol = true
                    }
                }
            }
        }

        dependencies {
        }
    }
}

plugins {
    alias libs.plugins.python.envs.plugin
}

apply from: "$appServicesRootDir/build-scripts/component-common.gradle"
apply from: "$publishDir/publish.gradle"


android {
    namespace 'org.mozilla.experiments.nimbus'
}

dependencies {
    api project(":remotesettings")

    implementation libs.androidx.annotation
    implementation libs.androidx.core
    implementation libs.kotlinx.coroutines

    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.junit
    testImplementation libs.androidx.work.testing
}

ext.configureUniFFIBindgen("nimbus")
ext.dependsOnTheMegazord()
ext.configurePublish(appServicesGroupId, project.name, project.ext.description)
