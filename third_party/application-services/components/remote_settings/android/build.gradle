buildscript {
    if (gradle.hasProperty("mozconfig")) {
        repositories {
            gradle.mozconfig.substs.GRADLE_MAVEN_REPOSITORIES.each { repository ->
                maven {
                    url = repository
                    if (gradle.mozconfig.substs.ALLOW_INSECURE_GRADLE_REPOSITORIES) {
                        allowInsecureProtocol = true
                    }
                }
            }
        }

        dependencies {
        }
    }
}

plugins {
    alias libs.plugins.python.envs.plugin
}

apply from: "$appServicesRootDir/build-scripts/component-common.gradle"
apply from: "$publishDir/publish.gradle"


android {
    namespace 'org.mozilla.appservices.remotesettings'
}

dependencies {

}

ext.configureUniFFIBindgen("remote_settings")
ext.dependsOnTheMegazord()
ext.configurePublish(appServicesGroupId, project.name, project.ext.description)

dependencies {
    if (gradle.hasProperty("mozconfig")) {
        testImplementation project(':components:concept-fetch')
    } else {
        testImplementation libs.mozilla.concept.fetch
    }
    testImplementation project(":viaduct")
}
